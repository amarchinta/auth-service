server:
  port: ${SERVER_PORT:8081}

spring:
  application:
    name: auth-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/auth_db}
    username: ${DB_USERNAME:auth_user}
    password: ${DB_PASSWORD:auth_pass}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
    show-sql: ${SHOW_SQL:true}

logging:
  level:
    "[com.quizapp]": ${LOG_LEVEL:INFO}

app:
  jwt:
    secret: ${JWT_SECRET:change-this-dev-secret-key-at-least-32-chars-long}
    expiration-minutes: 15
    refresh-expiration-days: 7

  admin:
    email: ${ADMIN_EMAIL:}
    password: ${ADMIN_PASSWORD:}
