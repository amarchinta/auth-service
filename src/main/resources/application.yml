server:
  port: 8081
spring:
  application:
    name: auth-service
  datasource:
    url: jdbc:postgresql://localhost:5432/auth_db
    username: auth_user
    password: auth_pass
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
    show-sql: true

logging:
  level:
    org.springframework.security: DEBUG

app:
  jwt:
    secret: ${JWT_SECRET:change-this-dev-secret-key-at-least-32-chars-long}
    expiration-minutes: 15
    refresh-expiration-days: 7
